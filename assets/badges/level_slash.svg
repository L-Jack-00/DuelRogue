<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 34" width="100%" height="100%">
  <defs>
    <!-- 연주황색(Light Orange) 네온 크리스탈 발광 필터 -->
    <filter id="glow-level-slash" x="-60%" y="-40%" width="220%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 연주황색 3D 크리스탈 단면 그라디언트 -->
    <linearGradient id="grad-level-slash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ffe3c2" />
      <stop offset="55%" stop-color="#ffb366" />
      <stop offset="85%" stop-color="#ff8c1a" />
      <stop offset="100%" stop-color="#b84500" />
    </linearGradient>
  </defs>

  <!-- 단일 레벨 빗금 (우상단 16도 기울어진 연주황색 슬래시) -->
  <g filter="url(#glow-level-slash)">
    <!-- 빗금 몸체 -->
    <polygon points="1,32 9,32 18,1 10,1" fill="url(#grad-level-slash)" stroke="#ffffff" stroke-width="0.5" opacity="0.95" />
    <!-- 중심 능선 샤프 하이라이트 -->
    <line x1="5" y1="31" x2="14" y2="2" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
  </g>
</svg>