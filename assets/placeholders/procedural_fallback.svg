<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <!-- 심연의 우주/던전 다크 그라디언트 -->
    <radialGradient id="bg-nebula" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e183a" />
      <stop offset="40%" stop-color="#0e111d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- 네온 그리드 & 룬 라인 그라디언트 -->
    <linearGradient id="neon-cyan-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.1" />
    </linearGradient>

    <filter id="fallback-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="320" height="240" fill="url(#bg-nebula)" />

  <!-- 기하학적 아케인 소환진 (O(1) Fallback Art) -->
  <g transform="translate(160, 120)" filter="url(#fallback-glow)">
    <!-- 외곽 회전 룬 서클 -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#neon-cyan-fade)" stroke-width="1.5" stroke-dasharray="12 6" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.5" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#d500f9" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.7" />

    <!-- 교차 삼각 룬 인장 -->
    <polygon points="0,-65 56,32 -56,32" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6" />
    <polygon points="0,65 56,-32 -56,-32" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.6" />

    <!-- 중심부 에너지 핵 -->
    <circle cx="0" cy="0" r="22" fill="#0c1022" stroke="#00e5ff" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#00e5ff" opacity="0.8" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />

    <!-- 4방위 마법 펄스 안테나 -->
    <line x1="0" y1="-85" x2="0" y2="-98" stroke="#00e5ff" stroke-width="2" />
    <line x1="0" y1="85" x2="0" y2="98" stroke="#00e5ff" stroke-width="2" />
    <line x1="-85" y1="0" x2="-98" y2="0" stroke="#00e5ff" stroke-width="2" />
    <line x1="85" y1="0" x2="98" y2="0" stroke="#00e5ff" stroke-width="2" />
  </g>

  <!-- 일러스트 대기 상태 알림 미세 라벨 -->
  <text x="160" y="215" text-anchor="middle" font-family="'Cinzel', 'Noto Sans KR', sans-serif" font-size="11" fill="#64748b" letter-spacing="3" opacity="0.8">AWAITING ARTWORK // SDXL READY</text>
</svg>