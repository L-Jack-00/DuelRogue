<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a35e"/><stop offset="0.45" stop-color="#d9773a"/><stop offset="1" stop-color="#a9512a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#efe5cf"/>
    </linearGradient>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="3.5" cy="3.5" r="1.25" fill="#7a3a17" opacity="0.28"/>
    </pattern>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="window">
      <rect width="400" height="560" fill="#fff"/>
      <rect x="22" y="70" width="356" height="350" rx="3" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#window)">
    <!-- card stock edge -->
    <rect x="2" y="2" width="396" height="556" rx="20" fill="#fdfaf2" stroke="#d8ccb2" stroke-width="2"/>
    <!-- type colour band with print dots -->
    <rect x="9" y="9" width="382" height="542" rx="15" fill="url(#band)" stroke="#4a2412" stroke-width="2.5"/>
    <rect x="9" y="9" width="382" height="542" rx="15" fill="url(#halftone)"/>
    <rect x="9" y="9" width="382" height="270" rx="15" fill="url(#gloss)"/>
  </g>
  <!-- name bar -->
  <rect x="20" y="14" width="360" height="50" rx="8" fill="url(#paper)" stroke="#4a2412" stroke-width="3"/>
  <rect x="25" y="18" width="350" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
  <!-- art window ink line -->
  <rect x="20.5" y="68.5" width="359" height="353" rx="4" fill="none" stroke="#4a2412" stroke-width="3.5"/>
  <rect x="17" y="65" width="366" height="360" rx="6" fill="none" stroke="#fdfaf2" stroke-width="2" opacity="0.85"/>
  <!-- text boxes -->
  <rect x="24" y="430" width="168" height="112" rx="7" fill="url(#paper)" stroke="#4a2412" stroke-width="3"/><rect x="208" y="430" width="168" height="112" rx="7" fill="url(#paper)" stroke="#4a2412" stroke-width="3"/>
  <!-- corner stickers -->
  <circle cx="20" cy="548" r="3" fill="#4a2412" opacity="0.55"/><circle cx="380" cy="548" r="3" fill="#4a2412" opacity="0.55"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
