<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <!-- 외곽 그림자 -->
    <filter id="shadow-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- [유희왕 2기 스타일 광폭 3D 양각 필터 (은은한 웜 톤 양각)] -->
    <filter id="yugioh-emboss-wide" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="3.5" flood-color="#3d2714" flood-opacity="0.6" result="box-shadow" />
      <feDropShadow dx="-1.5" dy="-1.5" stdDeviation="2" flood-color="#fff8eb" flood-opacity="0.4" result="light-glow" />
      <feMerge>
        <feMergeNode in="box-shadow" />
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="light-glow" />
      </feMerge>
    </filter>

    <!-- 미세 리벳 음영 -->
    <filter id="rivet-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.6" dy="0.8" stdDeviation="0.8" flood-color="#1a1104" flood-opacity="0.8" />
    </filter>

    <!-- 카드 최외곽용 앤틱 골드 금속 외곽선 그라디언트 -->
    <linearGradient id="metal-gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9d6" />
      <stop offset="22%" stop-color="#e5c158" />
      <stop offset="50%" stop-color="#7c5b18" />
      <stop offset="78%" stop-color="#d9b343" />
      <stop offset="100%" stop-color="#2c1e05" />
    </linearGradient>

    <!-- 필리그리 금세공 하이라이트 -->
    <linearGradient id="filigree-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#b48a2c" />
      <stop offset="100%" stop-color="#5c3e0b" />
    </linearGradient>

    <!-- 고풍스러운 양피지 종이 질감 바탕 -->
    <linearGradient id="paper-parchment-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6efe2" />
      <stop offset="35%" stop-color="#ece0c8" />
      <stop offset="70%" stop-color="#decfa8" />
      <stop offset="100%" stop-color="#c6b38b" />
    </linearGradient>

    <!-- 대각선 미세 마법 격자 패턴 (양피지 질감 보강) -->
    <pattern id="parchment-filigree-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 12 L 12 0 L 24 12 L 12 24 Z" fill="none" stroke="#8a6d3b" stroke-width="0.4" opacity="0.09" />
      <circle cx="12" cy="12" r="1.2" fill="#8a6d3b" opacity="0.06" />
    </pattern>

    <!-- 유희왕 2기 스타일 볼록 솟아오른 양각 레터박스 전용 그라디언트 -->
    <linearGradient id="paper-embossed-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fcf6ec" />
      <stop offset="75%" stop-color="#f2e5cb" />
      <stop offset="100%" stop-color="#e0cda6" />
    </linearGradient>

    <!-- 광폭 양각 베벨 상단/좌측 하이라이트 그라디언트 -->
    <linearGradient id="bevel-light-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <!-- 광폭 양각 베벨 하단/우측 그림자 그라디언트 -->
    <linearGradient id="bevel-shadow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a532d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#422912" stop-opacity="0.9" />
    </linearGradient>

    <!-- 코너 브래킷용 라디얼 금박 -->
    <radialGradient id="rivet-gold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#452c07" />
    </radialGradient>
  </defs>

  <!-- ======================================================== -->
  <!-- LAYER 2: 고밀도 몬스터 블랭크 바디 (정밀 벡터 필리그리 보강) -->
  <!-- ======================================================== -->
  <g id="layer2-frame-body">
    <!-- 카드 최외곽 바디 (중앙 일러스트 윈도우 컷아웃) -->
    <path fill-rule="evenodd" fill="url(#paper-parchment-base)" stroke="url(#metal-gold-bevel)" stroke-width="8"
          filter="url(#shadow-drop)"
          d="M 22,8
             L 378,8
             A 14,14 0 0 1 392,22
             L 392,538
             A 14,14 0 0 1 378,552
             L 22,552
             A 14,14 0 0 1 8,538
             L 8,22
             A 14,14 0 0 1 22,8 Z
             M 22,70
             L 378,70
             L 378,420
             L 22,420 Z" />

    <!-- 미세 양피지 다이아몬드 패턴 오버레이 (컷아웃 동일 영역) -->
    <path fill-rule="evenodd" fill="url(#parchment-filigree-grid)"
          d="M 22,12 L 378,12 A 10,10 0 0 1 388,22 L 388,538 A 10,10 0 0 1 378,548 L 22,548 A 10,10 0 0 1 12,538 L 12,22 A 10,10 0 0 1 22,12 Z M 22,70 L 378,70 L 378,420 L 22,420 Z" />

    <!-- 묵직한 이중 금속 인셋 림 & 헤어라인 각인 -->
    <rect x="13" y="13" width="374" height="534" rx="11" ry="11"
          fill="none" stroke="#3b2b08" stroke-width="2.6" opacity="0.88" />
    <rect x="16.5" y="16.5" width="367" height="527" rx="8.5" ry="8.5"
          fill="none" stroke="url(#filigree-gold)" stroke-width="1.0" opacity="0.65" />

    <!-- [사각 코너 장식 브래킷 & 리벳 (좌상/우상/좌하/우하)] -->
    <g id="corner-ornaments" opacity="0.9">
      <!-- 좌상단 -->
      <path d="M 10,32 L 10,16 Q 10,10 16,10 L 32,10 L 26,15 L 15,15 L 15,26 Z" fill="url(#filigree-gold)" stroke="#2e1d05" stroke-width="0.8" />
      <circle cx="15.5" cy="15.5" r="2.6" fill="url(#rivet-gold)" filter="url(#rivet-shadow)" />
      <!-- 우상단 -->
      <path d="M 390,32 L 390,16 Q 390,10 384,10 L 368,10 L 374,15 L 385,15 L 385,26 Z" fill="url(#filigree-gold)" stroke="#2e1d05" stroke-width="0.8" />
      <circle cx="384.5" cy="15.5" r="2.6" fill="url(#rivet-gold)" filter="url(#rivet-shadow)" />
      <!-- 좌하단 -->
      <path d="M 10,528 L 10,544 Q 10,550 16,550 L 32,550 L 26,545 L 15,545 L 15,534 Z" fill="url(#filigree-gold)" stroke="#2e1d05" stroke-width="0.8" />
      <circle cx="15.5" cy="544.5" r="2.6" fill="url(#rivet-gold)" filter="url(#rivet-shadow)" />
      <!-- 우하단 -->
      <path d="M 390,528 L 390,544 Q 390,550 384,550 L 368,550 L 374,545 L 385,545 L 385,534 Z" fill="url(#filigree-gold)" stroke="#2e1d05" stroke-width="0.8" />
      <circle cx="384.5" cy="544.5" r="2.6" fill="url(#rivet-gold)" filter="url(#rivet-shadow)" />
      <!-- 중단 좌우 룬 노치 리벳 -->
      <circle cx="13.5" cy="245" r="2.2" fill="url(#rivet-gold)" filter="url(#rivet-shadow)" />
      <circle cx="386.5" cy="245" r="2.2" fill="url(#rivet-gold)" filter="url(#rivet-shadow)" />
      <path d="M 11,232 L 16,245 L 11,258" fill="none" stroke="#634511" stroke-width="1" opacity="0.7" />
      <path d="M 389,232 L 384,245 L 389,258" fill="none" stroke="#634511" stroke-width="1" opacity="0.7" />
    </g>

    <!-- ======================================================== -->
    <!-- [1. 최상단 이름 바 - 순수 광폭 양각 뼈대]                -->
    <!-- ======================================================== -->
    <g id="top-name-emboss-box" filter="url(#yugioh-emboss-wide)">
      <rect x="22" y="14" width="356" height="50" rx="8" ry="8"
            fill="url(#paper-embossed-box)" />
      <!-- 상/좌 광폭 베벨 -->
      <path d="M 30,15 L 370,15 A 7,7 0 0 1 377,22 L 377,25 L 23,25 L 23,22 A 7,7 0 0 1 30,15 Z" fill="#ffffff" opacity="0.95" />
      <path d="M 23,22 L 23,56 L 26,56 L 26,22 Z" fill="#ffffff" opacity="0.85" />
      <path d="M 24,25 L 376,25 L 370,30 L 30,30 L 30,56 L 24,56 Z" fill="url(#bevel-light-grad)" opacity="0.5" />
      <!-- 하/우 광폭 베벨 -->
      <path d="M 23,62 L 370,62 A 7,7 0 0 0 377,55 L 377,63 L 30,63 A 7,7 0 0 1 23,62 Z" fill="#422912" opacity="0.75" />
      <path d="M 375,22 L 375,56 L 378,56 L 378,22 Z" fill="#422912" opacity="0.75" />
      <path d="M 30,58 L 370,58 L 376,53 L 376,25 L 371,30 L 371,53 L 30,53 Z" fill="url(#bevel-shadow-grad)" opacity="0.45" />
      <!-- 미세 내곽 장식선 -->
      <rect x="27" y="19" width="346" height="40" rx="5" ry="5" fill="none" stroke="#c8ad7c" stroke-width="0.8" opacity="0.55" />
    </g>

    <!-- [중단: 일러스트 윈도우 고밀도 금속 베벨 & 코너 컷아웃] -->
    <rect x="20" y="68" width="360" height="354" rx="5" ry="5"
          fill="none" stroke="url(#metal-gold-bevel)" stroke-width="3.6" />
    <rect x="22.5" y="70.5" width="355" height="349" rx="2.5" ry="2.5"
          fill="none" stroke="#22180e" stroke-width="1.6" opacity="0.82" />
    <!-- 일러스트 윈도우 사각 코너 미세 삼각 필리그리 -->
    <g fill="url(#filigree-gold)" stroke="#2c1e05" stroke-width="0.6" opacity="0.9">
      <polygon points="18,66 32,66 18,80" />
      <polygon points="382,66 368,66 382,80" />
      <polygon points="18,424 32,424 18,410" />
      <polygon points="382,424 368,424 382,410" />
    </g>

    <!-- ======================================================== -->
    <!-- [2. 하단 좌측: 태그/효과 박스 - 순수 광폭 양각 뼈대]      -->
    <!-- ======================================================== -->
    <g id="bottom-tag-emboss-box" filter="url(#yugioh-emboss-wide)">
      <rect x="22" y="428" width="172" height="116" rx="8" ry="8"
            fill="url(#paper-embossed-box)" />
      <!-- 배경 은은한 양피지 각인 문양 -->
      <path d="M 108,448 L 122,486 L 108,524 L 94,486 Z" fill="none" stroke="#c5ab7c" stroke-width="1" opacity="0.22" />
      <circle cx="108" cy="486" r="24" fill="none" stroke="#c5ab7c" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.22" />
      <!-- 상/좌 광폭 베벨 -->
      <path d="M 30,429 L 186,429 A 7,7 0 0 1 193,436 L 193,439 L 23,439 L 23,436 A 7,7 0 0 1 30,429 Z" fill="#ffffff" opacity="0.95" />
      <path d="M 23,436 L 23,536 L 26,536 L 26,436 Z" fill="#ffffff" opacity="0.85" />
      <path d="M 24,439 L 192,439 L 186,444 L 30,444 L 30,536 L 24,536 Z" fill="url(#bevel-light-grad)" opacity="0.5" />
      <!-- 하/우 광폭 베벨 -->
      <path d="M 23,542 L 186,542 A 7,7 0 0 0 193,535 L 193,543 L 30,543 A 7,7 0 0 1 23,542 Z" fill="#422912" opacity="0.75" />
      <path d="M 191,436 L 191,536 L 194,536 L 194,436 Z" fill="#422912" opacity="0.75" />
      <path d="M 30,538 L 186,538 L 192,533 L 192,439 L 187,444 L 187,533 L 30,533 Z" fill="url(#bevel-shadow-grad)" opacity="0.45" />
      <rect x="27" y="433" width="162" height="106" rx="5" ry="5" fill="none" stroke="#c8ad7c" stroke-width="0.7" opacity="0.5" />
    </g>

    <!-- ======================================================== -->
    <!-- [3. 하단 우측: 공/수 박스 - 양피지 양각 + 미세 각인]      -->
    <!-- ======================================================== -->
    <g id="bottom-stat-emboss-box" filter="url(#yugioh-emboss-wide)">
      <rect x="206" y="428" width="172" height="116" rx="8" ry="8"
            fill="url(#paper-embossed-box)" />
      <!-- 상/하 칸 은은한 워터마크 아이콘 (상단 검, 하단 방패 실루엣) -->
      <path d="M 225,445 L 231,451 L 228,454 L 222,448 Z M 224,458 L 236,446" stroke="#b99c6b" stroke-width="1.4" opacity="0.18" fill="none" />
      <path d="M 222,504 L 234,504 L 234,512 Q 228,519 222,512 Z" stroke="#b99c6b" stroke-width="1.2" opacity="0.18" fill="none" />
      <!-- 상/좌 광폭 베벨 -->
      <path d="M 214,429 L 370,429 A 7,7 0 0 1 377,436 L 377,439 L 207,439 L 207,436 A 7,7 0 0 1 214,429 Z" fill="#ffffff" opacity="0.95" />
      <path d="M 207,436 L 207,536 L 210,536 L 210,436 Z" fill="#ffffff" opacity="0.85" />
      <path d="M 208,439 L 376,439 L 370,444 L 214,444 L 214,536 L 208,536 Z" fill="url(#bevel-light-grad)" opacity="0.5" />
      <!-- 하/우 광폭 베벨 -->
      <path d="M 207,542 L 370,542 A 7,7 0 0 0 377,535 L 377,543 L 214,543 A 7,7 0 0 1 207,542 Z" fill="#422912" opacity="0.75" />
      <path d="M 375,436 L 375,536 L 378,536 L 378,436 Z" fill="#422912" opacity="0.75" />
      <path d="M 214,538 L 370,538 L 376,533 L 376,439 L 371,444 L 371,533 L 214,533 Z" fill="url(#bevel-shadow-grad)" opacity="0.45" />
      <rect x="211" y="433" width="162" height="106" rx="5" ry="5" fill="none" stroke="#c8ad7c" stroke-width="0.7" opacity="0.5" />
      <!-- 중앙 장식 분할선 -->
      <line x1="216" y1="486" x2="368" y2="486" stroke="#c8b084" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85" />
      <polygon points="292,482 296,486 292,490 288,486" fill="#c8b084" opacity="0.65" />
    </g>
  </g>
</svg>
