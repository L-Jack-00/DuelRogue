<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="pa-bg" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#280909" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#090305" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pa-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="pa-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="pa-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#pa-bg)" />
  <circle cx="128" cy="128" r="106" fill="none" stroke="url(#pa-gold)" stroke-width="2" opacity="0.55" stroke-dasharray="6 4" />

  <!-- 콜로세움 아치 게이트 -->
  <g stroke="url(#pa-gold)" stroke-width="2.5" fill="#1c0d0d">
    <path d="M 52,202 L 52,110 Q 52,46 128,46 Q 204,46 204,110 L 204,202 L 176,202 L 176,120 Q 176,78 128,78 Q 80,78 80,120 L 80,202 Z" />
    <line x1="42" y1="204" x2="214" y2="204" stroke-width="3.5" />
  </g>
  <!-- 게이트 창살 & 불빛 -->
  <g stroke="#fb923c" stroke-width="1.6" opacity="0.45">
    <line x1="104" y1="90" x2="104" y2="196" />
    <line x1="128" y1="80" x2="128" y2="196" />
    <line x1="152" y1="90" x2="152" y2="196" />
  </g>

  <!-- 교차된 쌍검 -->
  <g filter="url(#pa-glow)">
    <g transform="translate(128,136) rotate(-42)">
      <polygon points="0,-96 9,-72 7,38 -7,38 -9,-72" fill="url(#pa-steel)" stroke="#e2e8f0" stroke-width="1" />
      <rect x="-24" y="38" width="48" height="8" rx="3" fill="url(#pa-gold)" />
      <rect x="-5" y="46" width="10" height="24" rx="2" fill="#29120b" stroke="url(#pa-gold)" stroke-width="1.2" />
      <circle cx="0" cy="74" r="7" fill="url(#pa-gold)" />
    </g>
    <g transform="translate(128,136) rotate(42)">
      <polygon points="0,-96 9,-72 7,38 -7,38 -9,-72" fill="url(#pa-steel)" stroke="#e2e8f0" stroke-width="1" />
      <rect x="-24" y="38" width="48" height="8" rx="3" fill="url(#pa-gold)" />
      <rect x="-5" y="46" width="10" height="24" rx="2" fill="#29120b" stroke="url(#pa-gold)" stroke-width="1.2" />
      <circle cx="0" cy="74" r="7" fill="url(#pa-gold)" />
    </g>
    <!-- 교차점 방패 문장 -->
    <polygon points="128,112 146,128 128,154 110,128" fill="#7f1d1d" stroke="url(#pa-gold)" stroke-width="2.5" />
    <circle cx="128" cy="131" r="5" fill="#fef08a" />
  </g>
</svg>
