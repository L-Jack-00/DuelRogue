<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="ps-bg" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.78" />
      <stop offset="65%" stop-color="#062e23" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#02140f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ps-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="ps-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#ps-bg)" />
  <circle cx="128" cy="128" r="106" fill="none" stroke="url(#ps-gold)" stroke-width="2" opacity="0.55" stroke-dasharray="6 4" />

  <!-- 연철 간판 거치대 & 체인 -->
  <g stroke="url(#ps-gold)" fill="none" stroke-width="3">
    <line x1="48" y1="54" x2="208" y2="54" stroke-width="4" />
    <circle cx="52" cy="54" r="5" fill="url(#ps-gold)" />
    <circle cx="204" cy="54" r="5" fill="url(#ps-gold)" />
    <line x1="90" y1="54" x2="90" y2="78" stroke-width="2.5" />
    <line x1="166" y1="54" x2="166" y2="78" stroke-width="2.5" />
  </g>

  <!-- 매달린 부스터팩 & 길드 간판 방패 -->
  <g filter="url(#ps-glow)">
    <path d="M 62,76 L 194,76 L 194,166 Q 194,198 128,214 Q 62,198 62,166 Z"
          fill="#0f172a" stroke="url(#ps-gold)" stroke-width="3.5" />
    <path d="M 72,86 L 184,86 L 184,162 Q 184,188 128,202 Q 72,188 72,162 Z"
          fill="#064e3b" stroke="#6ee7b7" stroke-width="1" opacity="0.85" />

    <!-- 간판 내부 부스터팩 & 금화 -->
    <g transform="translate(110,142) rotate(-8)">
      <rect x="-28" y="-42" width="56" height="84" rx="4" fill="#1d4ed8" stroke="url(#ps-gold)" stroke-width="2" />
      <line x1="-28" y1="-28" x2="28" y2="-28" stroke="#e2e8f0" stroke-width="2" />
      <line x1="-28" y1="28" x2="28" y2="28" stroke="#e2e8f0" stroke-width="2" />
      <polygon points="0,-16 14,0 0,16 -14,0" fill="url(#ps-gold)" />
    </g>
    <!-- 앞쪽 황금 코인 2개 -->
    <circle cx="158" cy="160" r="20" fill="url(#ps-gold)" stroke="#713f12" stroke-width="2" />
    <circle cx="158" cy="160" r="14" fill="none" stroke="#fef9c3" stroke-width="1.2" />
    <polygon points="158,150 165,160 158,170 151,160" fill="#713f12" />
    <circle cx="136" cy="176" r="14" fill="url(#ps-gold)" stroke="#713f12" stroke-width="1.8" />
  </g>
</svg>
