<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#192552"/>
      <stop offset="55%" stop-color="#0d132e"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="48%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#9a6704"/>
    </linearGradient>
    <radialGradient id="iconOrb" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="arcaneGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base rounded emblem tile -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="url(#iconBg)" stroke="url(#iconGold)" stroke-width="14"/>
  <rect x="34" y="34" width="444" height="444" rx="72" fill="none" stroke="url(#iconGold)" stroke-width="3" opacity="0.55"/>

  <!-- Soft central arcane aura -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.18"/>
  <circle cx="256" cy="256" r="150" fill="#1e3a8a" opacity="0.16"/>

  <!-- Outer Concentric Magic Circle (matching card_back.svg) -->
  <g stroke="url(#iconGold)" fill="none">
    <circle cx="256" cy="256" r="196" stroke-width="7"/>
    <circle cx="256" cy="256" r="182" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.88"/>
    <circle cx="256" cy="256" r="154" stroke-width="3" opacity="0.72"/>

    <!-- 8-ray Arcane Spokes -->
    <g stroke-width="2.2" opacity="0.45">
      <line x1="256" y1="60" x2="256" y2="452"/>
      <line x1="60" y1="256" x2="452" y2="256"/>
      <line x1="117" y1="117" x2="395" y2="395"/>
      <line x1="395" y1="117" x2="117" y2="395"/>
    </g>
  </g>

  <!-- Corner / Cardinal Arcane Diamonds -->
  <g fill="url(#iconGold)">
    <polygon points="256,42 268,58 256,74 244,58"/>
    <polygon points="256,438 268,454 256,470 244,454"/>
    <polygon points="42,256 58,244 74,256 58,268"/>
    <polygon points="438,256 454,244 470,256 454,268"/>
  </g>

  <!-- Interlocking Hexagram Star Seal -->
  <g filter="url(#arcaneGlow)" stroke="url(#iconGold)" stroke-width="10" stroke-linejoin="round" fill="none">
    <polygon points="256,98 393,334 119,334"/>
    <polygon points="256,414 119,178 393,178"/>
  </g>
  <!-- Crisp inner golden hairline on hexagram -->
  <g stroke="#fef9c3" stroke-width="2.4" stroke-linejoin="round" fill="none" opacity="0.75">
    <polygon points="256,98 393,334 119,334"/>
    <polygon points="256,414 119,178 393,178"/>
  </g>

  <!-- Center Eye & Star Sapphire Emblem -->
  <circle cx="256" cy="256" r="64" fill="#070d22" stroke="url(#iconGold)" stroke-width="5.5"/>
  <path d="M 198,256 Q 256,204 314,256 Q 256,308 198,256 Z" fill="#020617" stroke="url(#iconGold)" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="24" fill="url(#iconOrb)" stroke="#e0f2fe" stroke-width="2"/>
  <circle cx="256" cy="256" r="10" fill="#050814"/>
  <!-- 4-point Golden Star Spark inside Eye -->
  <path d="M 256,238 L 260,252 L 274,256 L 260,260 L 256,274 L 252,260 L 238,256 L 252,252 Z" fill="#fef08a"/>
</svg>
