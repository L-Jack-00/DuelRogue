<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="pl-bg" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#6b21a8" stop-opacity="0.82" />
      <stop offset="65%" stop-color="#1e0938" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#090314" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pl-lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pl-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="pl-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#pl-bg)" />
  <circle cx="128" cy="128" r="106" fill="none" stroke="url(#pl-gold)" stroke-width="2" opacity="0.55" stroke-dasharray="6 4" />

  <!-- 후드 실루엣 & 그림자 -->
  <path d="M 64,202 C 64,132 86,52 128,44 C 170,52 192,132 192,202 Z" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" opacity="0.65" />

  <!-- 빛나는 연금 랜턴 -->
  <circle cx="96" cy="124" r="52" fill="url(#pl-lantern-glow)" />
  <g filter="url(#pl-glow)">
    <path d="M 96,52 L 96,70" stroke="url(#pl-gold)" stroke-width="3" />
    <circle cx="96" cy="48" r="5" fill="none" stroke="url(#pl-gold)" stroke-width="2.2" />
    <polygon points="74,80 118,80 106,68 86,68" fill="#1e1b4b" stroke="url(#pl-gold)" stroke-width="2" />
    <polygon points="76,80 116,80 110,144 82,144" fill="#fef08a" stroke="url(#pl-gold)" stroke-width="2.8" />
    <line x1="96" y1="80" x2="96" y2="144" stroke="#78350f" stroke-width="2" />
    <polygon points="72,144 120,144 114,156 78,156" fill="#1e1b4b" stroke="url(#pl-gold)" stroke-width="2" />
    <!-- 밀봉된 암시장 카드 봉투 -->
    <g transform="translate(152, 152) rotate(10)">
      <rect x="-44" y="-30" width="88" height="60" rx="5" fill="#f5e6c8" stroke="url(#pl-gold)" stroke-width="2.5" />
      <path d="M -44,-30 L 0,4 L 44,-30" fill="none" stroke="#92400e" stroke-width="2.2" />
      <!-- 붉은 밀랍 씰 -->
      <circle cx="0" cy="4" r="12" fill="#991b1b" stroke="#450a0a" stroke-width="1.6" />
      <polygon points="0,-3 4,4 0,11 -4,4" fill="#fde047" />
    </g>
  </g>
</svg>
