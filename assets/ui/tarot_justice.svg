<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="100%" height="100%">
  <defs>
    <radialGradient id="tj-sky" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="48%" stop-color="#0f2557" />
      <stop offset="85%" stop-color="#09132e" />
      <stop offset="100%" stop-color="#040814" />
    </radialGradient>
    <radialGradient id="tj-halo" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tj-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="60%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="tj-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="tj-bottom-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040814" stop-opacity="0" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0.92" />
    </linearGradient>
    <filter id="tj-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 & 타로 테두리 -->
  <rect x="0" y="0" width="320" height="512" rx="16" fill="url(#tj-sky)" />
  <circle cx="160" cy="210" r="145" fill="url(#tj-halo)" />

  <!-- 방사형 천상의 빛줄기 -->
  <g stroke="#7dd3fc" stroke-width="1" opacity="0.22">
    <line x1="160" y1="205" x2="160" y2="30" />
    <line x1="160" y1="205" x2="50" y2="65" />
    <line x1="160" y1="205" x2="270" y2="65" />
    <line x1="160" y1="205" x2="25" y2="160" />
    <line x1="160" y1="205" x2="295" y2="160" />
    <line x1="160" y1="205" x2="40" y2="290" />
    <line x1="160" y1="205" x2="280" y2="290" />
  </g>

  <!-- 배경 천상 아치 & 동심 룬 링 -->
  <g fill="none" stroke="url(#tj-gold)" opacity="0.65">
    <circle cx="160" cy="205" r="106" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="160" cy="205" r="88" stroke-width="1.0" />
    <path d="M 48,350 L 48,145 Q 48,55 160,42 Q 272,55 272,145 L 272,350" stroke-width="1.8" opacity="0.55" />
  </g>

  <!-- 별자리 포인트 -->
  <g fill="#e0f2fe" opacity="0.85">
    <polygon points="62,92 65,99 72,102 65,105 62,112 59,105 52,102 59,99" />
    <polygon points="258,92 261,99 268,102 261,105 258,112 255,105 248,102 255,99" />
    <circle cx="95" cy="70" r="2" />
    <circle cx="225" cy="70" r="2" />
    <circle cx="160" cy="54" r="2.8" />
  </g>

  <!-- 수직 성검 (뒤쪽 중앙 축) -->
  <g filter="url(#tj-glow)">
    <polygon points="160,64 170,88 168,265 152,265 150,88" fill="url(#tj-steel)" stroke="#e0f2fe" stroke-width="0.9" />
    <line x1="160" y1="74" x2="160" y2="260" stroke="#ffffff" stroke-width="1.4" opacity="0.7" />
    <!-- 검 가드 & 손잡이 -->
    <path d="M 118,266 L 202,266 L 194,276 L 126,276 Z" fill="url(#tj-gold)" stroke="#451a03" stroke-width="1" />
    <rect x="155" y="276" width="10" height="36" rx="2" fill="#1e293b" stroke="url(#tj-gold)" stroke-width="1.2" />
    <circle cx="160" cy="318" r="8" fill="url(#tj-gold)" />
  </g>

  <!-- 거대 성역 타워 방패 (중앙 전경) -->
  <g>
    <path d="M 110,148 L 210,148 L 210,230 Q 210,282 160,308 Q 110,282 110,230 Z"
          fill="#0f172a" stroke="url(#tj-gold)" stroke-width="4" />
    <path d="M 118,156 L 202,156 L 202,228 Q 202,272 160,295 Q 118,272 118,228 Z"
          fill="#172554" stroke="#60a5fa" stroke-width="1.2" opacity="0.9" />
    <!-- 방패 내부 사파이어 십자 & 날개 문양 -->
    <path d="M 160,164 L 160,284 M 126,206 L 194,206" stroke="url(#tj-gold)" stroke-width="3" />
    <polygon points="160,190 174,206 160,222 146,206" fill="#38bdf8" stroke="url(#tj-gold)" stroke-width="1.8" />
    <circle cx="160" cy="206" r="5" fill="#e0f2fe" />
  </g>

  <!-- 정의의 황금 천칭 (방패 위 좌우 균형) -->
  <g stroke="url(#tj-gold)" fill="none" filter="url(#tj-glow)">
    <!-- 가로 대들보 -->
    <path d="M 72,140 Q 160,126 248,140" stroke-width="3.2" />
    <circle cx="160" cy="133" r="6" fill="url(#tj-gold)" />
    <!-- 좌측 접시 -->
    <line x1="76" y1="140" x2="60" y2="195" stroke-width="1.2" />
    <line x1="76" y1="140" x2="92" y2="195" stroke-width="1.2" />
    <path d="M 54,195 Q 76,214 98,195 Z" fill="url(#tj-gold)" />
    <!-- 우측 접시 -->
    <line x1="244" y1="140" x2="228" y2="195" stroke-width="1.2" />
    <line x1="244" y1="140" x2="260" y2="195" stroke-width="1.2" />
    <path d="M 222,195 Q 244,214 266,195 Z" fill="url(#tj-gold)" />
  </g>

  <!-- 하단 텍스트 가독성 그라디언트 페이드 -->
  <rect x="0" y="310" width="320" height="202" fill="url(#tj-bottom-fade)" />

  <!-- 오너먼트 황금 타로 카드 테두리 -->
  <rect x="8" y="8" width="304" height="496" rx="14" fill="none" stroke="url(#tj-gold)" stroke-width="4.5" />
  <rect x="16" y="16" width="288" height="480" rx="10" fill="none" stroke="#93c5fd" stroke-width="0.9" opacity="0.45" />
  <!-- 코너 다이아몬드 -->
  <g fill="url(#tj-gold)">
    <polygon points="16,28 24,16 32,28 24,40" />
    <polygon points="304,28 296,16 288,28 296,40" />
    <polygon points="16,484 24,472 32,484 24,496" />
    <polygon points="304,484 296,472 288,484 296,496" />
  </g>
</svg>
