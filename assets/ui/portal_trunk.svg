<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="pt-bg" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.82" />
      <stop offset="65%" stop-color="#271406" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0f0702" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pt-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="pt-leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="pt-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#pt-bg)" />
  <circle cx="128" cy="128" r="106" fill="none" stroke="url(#pt-gold)" stroke-width="2" opacity="0.55" stroke-dasharray="6 4" />

  <!-- 열린 트렁크 뒷뚜껑 & 흘러넘치는 카드 부채 -->
  <g filter="url(#pt-glow)">
    <path d="M 54,122 L 72,72 Q 128,58 184,72 L 202,122 Z" fill="#291205" stroke="url(#pt-gold)" stroke-width="3" />
    <!-- 흘러넘치는 카드들 -->
    <g transform="translate(96,100) rotate(-22)">
      <rect x="-20" y="-32" width="40" height="60" rx="4" fill="#1e3a8a" stroke="url(#pt-gold)" stroke-width="2" />
      <polygon points="0,-12 9,0 0,12 -9,0" fill="#38bdf8" />
    </g>
    <g transform="translate(160,100) rotate(20)">
      <rect x="-20" y="-32" width="40" height="60" rx="4" fill="#7f1d1d" stroke="url(#pt-gold)" stroke-width="2" />
      <polygon points="0,-12 9,0 0,12 -9,0" fill="#fca5a5" />
    </g>
    <g transform="translate(128,92) rotate(-2)">
      <rect x="-22" y="-36" width="44" height="64" rx="4" fill="#4c1d95" stroke="url(#pt-gold)" stroke-width="2.4" />
      <circle cx="0" cy="-4" r="9" fill="url(#pt-gold)" />
    </g>

    <!-- 트렁크 본체 -->
    <rect x="46" y="118" width="164" height="82" rx="8" fill="url(#pt-leather)" stroke="url(#pt-gold)" stroke-width="3.2" />
    <!-- 철제 벨트 스트랩 2줄 -->
    <rect x="74" y="118" width="16" height="82" fill="#1e293b" stroke="url(#pt-gold)" stroke-width="1.8" />
    <rect x="166" y="118" width="16" height="82" fill="#1e293b" stroke="url(#pt-gold)" stroke-width="1.8" />
    <!-- 중앙 황금 자물쇠 버클 -->
    <rect x="114" y="112" width="28" height="32" rx="4" fill="url(#pt-gold)" stroke="#451a03" stroke-width="1.8" />
    <circle cx="128" cy="125" r="4" fill="#291205" />
    <polygon points="126,127 130,127 132,137 124,137" fill="#291205" />
  </g>
</svg>
