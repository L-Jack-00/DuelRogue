<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 448" width="100%" height="100%">
  <defs>
    <radialGradient id="cbBg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#192552"/>
      <stop offset="58%" stop-color="#0d132e"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <linearGradient id="cbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="48%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#9a6704"/>
    </linearGradient>
    <radialGradient id="cbOrb" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="42%" stop-color="#38bdf8"/>
      <stop offset="82%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Outer Gold Frame & Deep Navy Panel -->
  <rect x="8" y="8" width="304" height="432" rx="18" fill="url(#cbBg)" stroke="url(#cbGold)" stroke-width="12"/>
  <rect x="24" y="24" width="272" height="400" rx="10" fill="none" stroke="url(#cbGold)" stroke-width="4" opacity="0.72"/>

  <!-- 4 Bold Corner Diamonds -->
  <g fill="url(#cbGold)">
    <polygon points="40,32 48,40 40,48 32,40"/>
    <polygon points="280,32 288,40 280,48 272,40"/>
    <polygon points="40,400 48,408 40,416 32,408"/>
    <polygon points="280,400 288,408 280,416 272,408"/>
  </g>

  <!-- Simple Crisp Magic Circle Rings -->
  <circle cx="160" cy="224" r="98" fill="#1e3a8a" fill-opacity="0.18" stroke="url(#cbGold)" stroke-width="7"/>
  <circle cx="160" cy="224" r="80" fill="none" stroke="url(#cbGold)" stroke-width="3" opacity="0.78"/>

  <!-- Bold Interlocking Hexagram Star Seal (app_icon motif) -->
  <g stroke="url(#cbGold)" stroke-width="8.5" stroke-linejoin="round" fill="none">
    <polygon points="160,130 241,271 79,271"/>
    <polygon points="160,318 79,177 241,177"/>
  </g>

  <!-- Center Eye & Sapphire Star Seal -->
  <circle cx="160" cy="224" r="42" fill="#070d22" stroke="url(#cbGold)" stroke-width="5"/>
  <path d="M 122,224 Q 160,188 198,224 Q 160,260 122,224 Z" fill="#020617" stroke="url(#cbGold)" stroke-width="4.5" stroke-linejoin="round"/>
  <circle cx="160" cy="224" r="17" fill="url(#cbOrb)" stroke="#e0f2fe" stroke-width="2"/>
  <circle cx="160" cy="224" r="7" fill="#050814"/>
  <path d="M 160,211 L 163,221 L 173,224 L 163,227 L 160,237 L 157,227 L 147,224 L 157,221 Z" fill="#fef08a"/>
</svg>
