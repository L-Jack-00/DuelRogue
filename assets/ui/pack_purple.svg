<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%">
  <defs>
    <linearGradient id="pp-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="35%" stop-color="#2e1065" />
      <stop offset="70%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#0f0322" />
    </linearGradient>
    <linearGradient id="pp-foil" x1="0%" y1="0%" x2="100%" y2="25%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="38%" stop-color="#e879f9" stop-opacity="0.26" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="pp-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="28%" stop-color="#f3e8ff" />
      <stop offset="52%" stop-color="#a78bfa" />
      <stop offset="78%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="pp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <pattern id="pp-crimp" width="10" height="40" patternUnits="userSpaceOnUse">
      <rect width="5" height="40" fill="#000000" opacity="0.24" />
      <rect x="5" width="5" height="40" fill="#ffffff" opacity="0.14" />
    </pattern>
    <filter id="pp-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect x="26" y="14" width="268" height="452" rx="8" fill="#080214" opacity="0.48" />
  <path d="M 24,10 L 296,10 L 296,48 L 288,54 L 288,426 L 296,432 L 296,470 L 24,470 L 24,432 L 32,426 L 32,54 L 24,48 Z"
        fill="url(#pp-body)" stroke="#d8b4fe" stroke-width="1.5" />

  <rect x="25" y="11" width="270" height="36" rx="2" fill="url(#pp-silver)" opacity="0.88" />
  <rect x="25" y="11" width="270" height="36" rx="2" fill="url(#pp-crimp)" />
  <line x1="24" y1="47" x2="296" y2="47" stroke="#f3e8ff" stroke-width="1.8" />

  <rect x="25" y="433" width="270" height="36" rx="2" fill="url(#pp-silver)" opacity="0.88" />
  <rect x="25" y="433" width="270" height="36" rx="2" fill="url(#pp-crimp)" />
  <line x1="24" y1="433" x2="296" y2="433" stroke="#f3e8ff" stroke-width="1.8" />

  <rect x="40" y="58" width="240" height="364" rx="8" fill="none" stroke="url(#pp-gold)" stroke-width="2.5" />
  <rect x="47" y="65" width="226" height="350" rx="5" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.45" />
  <ellipse cx="160" cy="235" rx="92" ry="44" transform="rotate(-24 160 235)" fill="none" stroke="#e9d5ff" stroke-width="1.2" opacity="0.4" />
  <ellipse cx="160" cy="235" rx="92" ry="44" transform="rotate(24 160 235)" fill="none" stroke="#e9d5ff" stroke-width="1.2" opacity="0.4" />

  <polygon points="100,72 220,72 206,96 114,96" fill="#1e0945" stroke="url(#pp-gold)" stroke-width="1.8" />
  <polygon points="160,76 168,84 160,92 152,84" fill="#e879f9" stroke="url(#pp-gold)" stroke-width="1.2" />

  <!-- 운명의 전시안 & 쌍둥이 주사위 엠블럼 -->
  <g filter="url(#pp-glow)">
    <polygon points="160,148 214,210 160,272 106,210" fill="#1e1b4b" stroke="url(#pp-gold)" stroke-width="3.2" />
    <!-- 전시안 -->
    <path d="M 118,210 Q 160,176 202,210 Q 160,244 118,210 Z" fill="#f5d0fe" stroke="url(#pp-gold)" stroke-width="2" />
    <circle cx="160" cy="210" r="18" fill="#6b21a8" stroke="url(#pp-gold)" stroke-width="1.8" />
    <ellipse cx="160" cy="210" rx="5" ry="13" fill="#090218" />
    <circle cx="155" cy="204" r="3" fill="#ffffff" />

    <!-- 하단 좌우 주사위 -->
    <g transform="translate(114, 286) rotate(-14)">
      <polygon points="0,-20 18,-9 18,12 0,23 -18,12 -18,-9" fill="#4c1d95" stroke="url(#pp-gold)" stroke-width="2" />
      <circle cx="0" cy="-8" r="2.5" fill="#fef08a" />
      <circle cx="-8" cy="7" r="2.2" fill="#f0abfc" />
      <circle cx="8" cy="7" r="2.2" fill="#f0abfc" />
    </g>
    <g transform="translate(206, 286) rotate(14)">
      <polygon points="0,-20 18,-9 18,12 0,23 -18,12 -18,-9" fill="#4c1d95" stroke="url(#pp-gold)" stroke-width="2" />
      <circle cx="-6" cy="-9" r="2.2" fill="#fef08a" />
      <circle cx="6" cy="-7" r="2.2" fill="#fef08a" />
      <circle cx="8" cy="7" r="2.6" fill="#fef08a" />
    </g>
  </g>

  <polygon points="116,386 204,386 218,406 102,406" fill="#1e0945" stroke="url(#pp-gold)" stroke-width="1.6" />
  <circle cx="160" cy="396" r="4.5" fill="#e879f9" />
  <circle cx="130" cy="396" r="2.5" fill="url(#pp-gold)" />
  <circle cx="190" cy="396" r="2.5" fill="url(#pp-gold)" />

  <path d="M 32,54 L 288,54 L 288,426 L 32,426 Z" fill="url(#pp-foil)" pointer-events="none" />
  <line x1="34" y1="54" x2="34" y2="426" stroke="#ffffff" stroke-width="2" opacity="0.24" />
</svg>
